# Render Blueprint: one Node web service that builds the React app and serves
# it plus the /api routes from Express (`npm run serve`).
# Deploy: Render dashboard → New → Blueprint → pick this repo → paste GROQ_API_KEY.
services:
  - type: web
    name: fridge-to-fork
    runtime: node
    plan: free
    # --include=dev: Vite is a devDependency but is needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false # entered in the dashboard, never committed
      - key: NODE_VERSION
        value: "22"
      - key: RATE_LIMIT_MAX
        value: "40" # model calls per IP per 10 minutes
